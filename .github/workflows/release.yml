name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/release/steamrollbackr dist/
          cp packaging/steamrollbackr.desktop dist/
          cp README.md dist/
          tar -czf steamrollbackr-linux-x86_64.tar.gz -C dist .
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: steamrollbackr-linux-x86_64.tar.gz
